<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DLSite Manager</title>
  <link rel="icon" href="system/assets/icon.png">
  <link rel="stylesheet" href="system/style.css">
</head>
<body>

  <nav id="menu-bar">
    <button type="button" class="menu-item">Action</button>
    <button type="button" class="menu-item">View</button>
    <button type="button" class="menu-item" id="menu-settings-btn">Settings</button>
    <button type="button" class="menu-item">Help</button>
  </nav>

  <div id="workspace">

    <section id="list-panel">
      <div id="table-scroll">
        <!-- Header cells, columns, and rows are all generated by
             system/table.js from a column-config array, so that column
             order/width/visibility/sort can be edited at runtime and
             persisted. Nothing here is hand-written per column anymore. -->
        <table id="game-table">
          <colgroup id="game-table-colgroup"></colgroup>
          <thead id="game-table-head"></thead>
          <tbody id="game-table-body"></tbody>
        </table>
      </div>

      <div id="find-bar">
        <span id="find-icon" aria-hidden="true">⌕</span>
        <input id="find-input" type="text" placeholder="Filter games">
      </div>
    </section>

    <div id="panel-splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

    <aside id="edit-panel">
      <div id="edit-content">
        <div id="image-strip"></div>

        <div class="edit-field">
          <label>Product Code</label>
          <p class="edit-value" id="field-productcode"></p>
        </div>

        <div class="edit-field">
          <label>Path</label>
          <p class="edit-value edit-value--path">
            <span id="field-path-text"></span>
            <button type="button" class="btn btn--inline" id="browse-path-btn">Browse</button>
          </p>
        </div>

        <nav id="edit-tabs">
          <button type="button" class="edit-tab is-active" data-tab="modified">Game info</button>
          <button type="button" class="edit-tab" data-tab="original">Original info</button>
        </nav>

        <div id="edit-tab-modified" class="edit-tab-pane is-active"></div>
        <div id="edit-tab-original" class="edit-tab-pane"></div>

        <div class="launch-field">
          <input type="checkbox" id="launcher-enabled-checkbox">
          <input type="text" id="launcher-input" class="launch-input" placeholder="Launcher">
        </div>
        <div class="launch-field">
          <input type="checkbox" id="launch-params-enabled-checkbox">
          <input type="text" id="launch-params-input" class="launch-input" placeholder="Launch parameters">
        </div>

        <div class="edit-toolbar edit-toolbar--bottom">
          <button type="button" class="btn btn--primary" id="edit-toggle-btn">Edit</button>
          <button type="button" class="btn" id="edit-apply-btn" hidden>Apply</button>
          <button type="button" class="btn" id="edit-download-btn">Download info</button>
        </div>
      </div>
    </aside>

  </div>

  <div id="image-preview-overlay" hidden>
    <img id="image-preview-img" alt="">
  </div>

  <footer id="status-bar">
    <span>0 games catalogued</span>
  </footer>

  <script src="system/app.js" defer></script>
</body>
</html>
